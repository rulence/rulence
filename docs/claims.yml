# Rulence claims ledger.
#
# Every public claim about Rulence must have an entry here. The verifier
# (`rulence claims verify`) loads this file, validates the schema, and scans
# README, docs, CLI help, and packaging metadata for any blocked phrases.
#
# Schema:
#   claim_id            string, lowercase_snake_case
#   claim_text          one-line summary
#   category            grouping for humans; not enforced
#   status              supported | partial | advisory | aspirational | unsupported
#   current_evidence    file/function references that prove the claim today
#   required_components what would have to exist for the claim to be true
#   acceptance_tests    test ids that must continue to pass
#   public_copy_allowed boolean; whether marketing copy may make this claim
#   allowed_phrasings   exact or close-to-exact phrases that are safe to use
#   blocked_phrases     phrases the scanner should refuse outside of roadmap sections
#   notes               human-readable caveats
#
# Rules enforced by src/rulence/claims.py:
#   * Unsupported claims must have public_copy_allowed: false.
#   * Aspirational + public requires a roadmap qualifier in claim_text.
#   * Supported claims must cite at least one current_evidence entry.
#   * Advisory claims should advertise themselves as advisory/optional/host-routed.

version: 1
claims:
  - claim_id: claude_code_pretooluse_block
    claim_text: "Blocks Claude Code tool calls via the PreToolUse hook when policy returns block."
    category: enforcement
    status: supported
    current_evidence:
      - "src/rulence/installers.py: install_claude_code and CLAUDE_HOOK"
      - "src/rulence/cli.py: _claude_code_pretooluse"
    required_components:
      - claude_code_hook_handler
      - preflight
    acceptance_tests:
      - tests.test_installers.test_install_claude_code_creates_hook
      - tests.test_rulence.test_claude_code_pretooluse_blocks_destructive_tool
    public_copy_allowed: true
    allowed_phrasings:
      - "real PreToolUse enforcement on Claude Code"
      - "blocks Claude Code tool calls via PreToolUse"
      - "hook-based governance for Claude Code"
    blocked_phrases: []
    notes: "Only Claude Code has a real runtime gate today."

