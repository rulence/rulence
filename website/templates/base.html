<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ config.description }}">
    <meta property="og:title" content="{{ config.title }}">
    <meta property="og:description" content="{{ config.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ config.base_url }}">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <canvas id="logic-canvas" aria-hidden="true"></canvas>

    <div class="announcement">
      <span>Rulence v0.3 launch build</span>
      <a href="{{ config.extra.pypi_url }}">pip install rulence -&gt;</a>
    </div>

    <header class="site-header">
      <nav aria-label="Primary navigation">
        <a href="#install">Install</a>
        <a href="#runners">Runners</a>
        <a href="#docs">Docs</a>
        <a href="{{ config.extra.github_url }}">GitHub</a>
        <a href="{{ config.extra.pypi_url }}">PyPI</a>
        <a href="{{ config.extra.npm_url }}">npm</a>
        <a href="{{ config.extra.docker_url }}">Docker</a>
      </nav>
      <a class="brand" href="./" aria-label="Rulence home">
        <img class="brand-wordmark" src="rulence-logo-v2.svg" alt="Rulence">
      </a>
    </header>

    {% block content %}{% endblock content %}

    <footer>
      <span>Rulence</span>
      <div class="footer-links">
        <a href="{{ config.extra.issues_url }}">Issues</a>
        <a href="{{ config.extra.changelog_url }}">Changelog</a>
        <a href="{{ config.extra.license_url }}">License</a>
        <a href="{{ config.extra.github_url }}">Source</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
