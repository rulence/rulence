[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rulence"
version = "0.3.0"
description = "Local-first reasoning governance for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rulence" }]
keywords = ["agents", "mcp", "reasoning", "policy", "preflight"]

[project.optional-dependencies]
mcp_client = ["mcp>=1.0.0"]
all = ["mcp>=1.0.0", "tiktoken>=0.7.0"]

[project.scripts]
rulence = "rulence.cli:main"
rulence-mcp = "rulence.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rulence = ["builtin_policies/*.toml"]
