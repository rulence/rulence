tier = 4
label = "git"
required_checks = ["memory_check", "tool_preflight", "constraint_solver"]
warn_if = ["memory_missing"]
block_if = ["destructive_with_weak_context"]
constraints = [
  "forbids(force-push, main)",
  "forbids(force-push, master)",
  "forbids(reset --hard, uncommitted)",
  "requires(rebase, backup)",
]
