tier = 5
label = "secrets"
required_checks = ["memory_check", "tool_preflight", "constraint_solver", "user_approval"]
warn_if = ["memory_missing"]
block_if = ["sensitive_or_destructive_action"]
constraints = [
  "forbids(secret, log)",
  "forbids(credential, commit)",
  "forbids(api_key, public)",
  "forbids(token, paste)",
  "requires(rotate, audit)",
]
